
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TASKDAWG</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body class="auth-page">
    <header class="navbar">
        <a class="logo" href="index.html">TASK<span>DAWG</span></a>
        <a href="index.html" class="nav-home">← Back to Home</a>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <p class="eyebrow">JOIN TASKDAWG</p>
            <h1>Create your <span>account.</span></h1>
            <p class="auth-description">Start organizing your work today.</p>

            <form id="registerForm">
                <label for="registerName">Full name</label>
                <input type="text" id="registerName" placeholder="Enter your name" required>

                <label for="registerEmail">Email address</label>
                <input type="email" id="registerEmail" placeholder="you@example.com" required>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="At least 6 characters" minlength="6" required>

                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" placeholder="Enter password again" minlength="6" required>

                <button class="btn btn-red full-width" type="submit">Create Account →</button>
                <p id="registerMessage" class="form-message"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
